# CI/CD de OmniMarket (R12/R13/R14).
# - En cada Pull Request: lint, pruebas, build, tipos y E2E.
# - En cada push a main: lo mismo y, SOLO si todo pasa, despliegue a producción en Vercel.
#   Si cualquier job falla, el job `deploy` no se ejecuta y producción no cambia.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # En PR se cancela la ejecución anterior; en main nunca se interrumpe un despliegue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, pruebas, build y tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores FICTICIOS: el build y las pruebas no se conectan a ninguna base.
      # Nunca poner secretos reales en este archivo.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/omnimarket_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/omnimarket_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar pnpm (versión de package.json)
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js con caché de pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias exactas del lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Pruebas unitarias y de integración (Vitest)
        run: pnpm test

      - name: Build de producción
        run: pnpm build

      # Después del build porque next-env.d.ts importa los tipos generados en .next/.
      - name: Typecheck
        run: pnpm typecheck

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omnimarket_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base efímera del propio job (no es un secreto ni toca Neon).
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omnimarket_e2e
      E2E_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/omnimarket_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omnimarket_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/omnimarket_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar pnpm (versión de package.json)
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js con caché de pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias exactas del lockfile
        run: pnpm install --frozen-lockfile

      - name: Aplicar migraciones en la base de prueba
        run: pnpm exec prisma migrate deploy

      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Ejecutar E2E
        run: pnpm test:e2e

      - name: Guardar reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy a producción (Vercel)
    # R14: solo se ejecuta si pasaron TODAS las validaciones, y solo para main.
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: https://omnimarket-operations-hub-rho.vercel.app
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Desplegar en Vercel (producción)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@65.2.0 deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Prueba de humo en producción
        run: |
          set -euo pipefail
          check() {
            local expected="$1" method="$2" path="$3"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" -X "$method" "$PRODUCTION_URL$path")
            echo "$method $path -> $code (esperado $expected)"
            [ "$code" = "$expected" ]
          }
          check 200 GET  "/login"
          check 200 GET  "/api/test/analytics?page=1&limit=50"
          check 200 GET  "/api/test/kanban-status"
          check 405 GET  "/api/test/reset-data"
          check 401 GET  "/api/products"
          # Página privada sin sesión: debe redirigir a /login.
          location=$(curl -s -o /dev/null -w "%{redirect_url}" "$PRODUCTION_URL/kanban")
          echo "GET /kanban -> redirige a: $location"
          case "$location" in *"/login"*) ;; *) echo "No redirige a /login"; exit 1 ;; esac
